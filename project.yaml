# fielddash project. Run `fielddash fields project.yaml` to list the form fields,
# then fill in `fields`, `filters` and `highlights`. Only `source` is required.

title: "Residuos Bacanga"
subtitle: ""

source:
  type: epicollect
  project: ${PROJECT_RESIDUOS_BACANGA}        # project slug (from the Epicollect5 project URL)
  credentials: RESIDUOS_BACANGA               # RESIDUOS_BACANGA_CLIENT_ID / RESIDUOS_BACANGA_CLIENT_SECRET; remove for public projects
  # form_ref: ${FORM_RESIDUOS_BACANGA_REF}    # optional (default: first form)

campos:
  localizacao: "f27864"
  idade: "83aec3"
  genero: "88c343"
  etnia: "98c336"
  bairro: "5401ce"
  ocupacao: "d3aecb"
  renda: "43aed7"
  escolaridade: "127852"
  frequencia_coleta: "23aee0"
  destino_lixo: "48c35e"
  separa_reciclagem: "527827"
  avaliacao_coleta: "d27837"

# Bairro é texto livre no formulário; tratar como categoria permite filtrar e cruzar
tipos:
  bairro: category

# Campos que não aparecem no dashboard
ignorar: ["2da40f", "3401cb", "f401ca"]   # consentimento, CEP, logradouro

filtros: [created_at, bairro, idade, genero, renda]

destaques:
  - {campo: frequencia_coleta, por: bairro}
  - {campo: destino_lixo}
  - {campo: avaliacao_coleta, por: renda}
  - {campo: separa_reciclagem, por: escolaridade}

mapa:
  campo: localizacao
  popup: [bairro, idade]

fuso: America/Fortaleza
cache_minutos: 5